# 백엔드 CI: push / PR 마다 Gradle 테스트(Testcontainers 통합 테스트 포함)를 자동 실행한다
# - ubuntu 러너에는 Docker가 기본 설치되어 있어 Testcontainers(PgVector)가 그대로 동작한다
# - 테스트는 가짜 Embedding/Chat 모델을 사용하므로 OpenAI 키·비용이 필요 없다
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# 같은 브랜치에 새 push가 오면 이전 실행을 취소한다
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle 설정 (의존성 캐시)
        uses: gradle/actions/setup-gradle@v4

      - name: 테스트 실행
        run: ./gradlew test --no-daemon

      - name: 테스트 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7
